repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy-evalkit
        name: mypy --strict evalkit
        entry: uv run mypy --strict evalkit
        language: system
        pass_filenames: false
      - id: mypy-tab
        name: mypy tab
        entry: uv run mypy tab
        language: system
        pass_filenames: false
      - id: dataset-hash
        name: frozen dataset list (HF-2)
        entry: uv run python ci/dataset_hash.py
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
